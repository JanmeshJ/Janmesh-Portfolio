  <script type="text/babel">
    const { useRef, useEffect } = React;

    function FadingVideo({ src, className, style }) {
      const vidRef     = useRef(null);
      const rafRef     = useRef(null);
      const fadingOut  = useRef(false);
      const FADE_MS    = 500;
      const LEAD       = 0.55;

      function fadeTo(vid, target, ms) {
        cancelAnimationFrame(rafRef.current);
        const from  = parseFloat(vid.style.opacity) || 0;
        const t0    = performance.now();
        function tick(now) {
          const p = Math.min((now - t0) / ms, 1);
          vid.style.opacity = from + (target - from) * p;
          if (p < 1) rafRef.current = requestAnimationFrame(tick);
        }
        rafRef.current = requestAnimationFrame(tick);
      }

      useEffect(() => {
        const vid = vidRef.current;
        if (!vid) return;
        vid.style.opacity = 0;

        function onLoaded() {
          vid.style.opacity = 0;
          vid.play().catch(() => {});
          fadeTo(vid, 1, FADE_MS);
        }
        function onTime() {
          const rem = vid.duration - vid.currentTime;
          if (!fadingOut.current && vid.duration && rem <= LEAD && rem > 0) {
            fadingOut.current = true;
            fadeTo(vid, 0, FADE_MS);
          }
        }
        function onEnded() {
          vid.style.opacity = 0;
          setTimeout(() => {
            vid.currentTime = 0;
            vid.play().catch(() => {});
            fadingOut.current = false;
            fadeTo(vid, 1, FADE_MS);
          }, 100);
        }

        vid.addEventListener('loadeddata', onLoaded);
        vid.addEventListener('timeupdate', onTime);
        vid.addEventListener('ended', onEnded);
        return () => {
          cancelAnimationFrame(rafRef.current);
          vid.removeEventListener('loadeddata', onLoaded);
          vid.removeEventListener('timeupdate', onTime);
          vid.removeEventListener('ended', onEnded);
        };
      }, []);

      return (
        <video
          ref={vidRef}
          src={src}
          autoPlay muted playsInline preload="auto"
          className={className}
          style={{ ...style, opacity: 0 }}
        />
      );
    }

    window.FadingVideo = FadingVideo;
  </script>

  <!-- ─── BlurText ─────────────────────────────────────────────── -->
  <script type="text/babel">
    const { useState: useSt, useRef: useRf, useEffect: useEf } = React;
    const { motion } = window.Motion;

    function BlurText({ text, className }) {
      const words          = text.split(' ');
      const [seen, setSeen] = useSt(false);
      const ref            = useRf(null);

      useEf(() => {
        const obs = new IntersectionObserver(
          ([e]) => { if (e.isIntersecting) setSeen(true); },
          { threshold: 0.1 }
        );
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);

      return (
        <p
          ref={ref}
          className={className}
          style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', rowGap:'0.1em' }}
        >
          {words.map((w, i) => (
            <motion.span
              key={i}
              initial={{ filter:'blur(10px)', opacity:0, y:50 }}
              animate={seen
                ? { filter:['blur(10px)','blur(5px)','blur(0px)'], opacity:[0,0.5,1], y:[50,-5,0] }
                : { filter:'blur(10px)', opacity:0, y:50 }
              }
              transition={{ duration:0.7, times:[0,0.5,1], ease:'easeOut', delay: i * 0.1 }}
              style={{ display:'inline-block', marginRight:'0.28em' }}
            >
              {w}
            </motion.span>
          ))}
        </p>
      );
    }

    window.BlurText = BlurText;
  </script>
